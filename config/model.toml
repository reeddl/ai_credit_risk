# AI company default model: version 1 configuration.
#
# Every number in this file is an expert placeholder, set so the pipeline
# runs end to end. None of them is fitted or sourced yet. Each one should be
# replaced, with its source and date, before results are used for anything.

[model]
# Horizon of the headline PD, in years. A 3-year PD is also reported.
headline_horizon_years = 1
# 3-year PD is derived from the 1-year PD with a constant hazard:
# PD_3y = 1 - (1 - PD_1y)^3
# Flag a company when scorecard and Merton log-odds differ by more than this.
merton_gap_flag_logodds = 1.5
# Risk-free rate used in the Merton equity valuation.
risk_free_rate = 0.04

[default_definition]
# A default is the first of these events inside the horizon.
events = ["missed_debt_payment", "bankruptcy_filing", "shutdown", "distressed_markdown"]
# A distressed sale or a down round counts when equity is marked down by at
# least this share from the last price investors paid.
markdown_threshold = 0.90
# Reference price: last funding round price, or last offering price for
# public companies.
reference_price = "last_round_or_offering"
down_rounds_count = true

# ---------------------------------------------------------------------------
# Segments. prior_pd_1y is the segment's starting 1-year PD under the wide
# default definition above (so it sits above a classic credit PD).
# gamma_* is the segment's extra log-odds shift per unit of scenario
# severity, for effects the company features don't capture (contagion,
# sentiment). Set a gamma to 0 to rely on feature re-scoring alone.
# ---------------------------------------------------------------------------

[segments.closed_model]
name = "Closed model providers"
prior_pd_1y = 0.06
gamma_compute_glut = 0.0
gamma_demand_stall = 0.5
gamma_funding_freeze = 0.8
gamma_rates_up = 0.1

[segments.open_weight_model]
name = "Open-weight model providers"
prior_pd_1y = 0.10
gamma_compute_glut = 0.0
gamma_demand_stall = 0.5
gamma_funding_freeze = 0.9
gamma_rates_up = 0.1

[segments.app_maker]
name = "AI app makers"
prior_pd_1y = 0.12
gamma_compute_glut = -0.1
gamma_demand_stall = 0.6
gamma_funding_freeze = 0.7
gamma_rates_up = 0.1

[segments.data_strong_moat]
