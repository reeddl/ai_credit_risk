gamma_demand_stall = 0.4
gamma_funding_freeze = 0.3
gamma_rates_up = 0.1

[segments.data_weak_moat]
name = "Data providers, weak moat"
prior_pd_1y = 0.09
gamma_compute_glut = 0.0
gamma_demand_stall = 0.5
gamma_funding_freeze = 0.5
gamma_rates_up = 0.1

[segments.neocloud]
name = "Neoclouds and data center operators"
